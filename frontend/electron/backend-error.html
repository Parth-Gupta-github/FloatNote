<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FloatNote — Startup Error</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: Segoe UI, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box { text-align: center; max-width: 460px; padding: 24px; }
      .title { font-size: 22px; font-weight: 700; color: #f87171; }

    <div class="box">
      <div class="title">Couldn't start the meeting engine</div>
