<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FloatNote Setup</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      form {
        width: 420px;
        padding: 32px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.sub {
        font-size: 13px;
        color: #94a3b8;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #cbd5e1;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 13px;
      }
      input:focus {
        outline: none;
        border-color: #6366f1;
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4f46e5;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        margin-top: 12px;
        font-size: 12px;
        color: #f87171;
        min-height: 16px;
      }
      a {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <form id="setup-form">
      <h1>Welcome to FloatNote</h1>
      <p class="sub">
        Enter your API keys to enable transcription, summaries and chat.
        These are stored locally and never leave your machine.
      </p>

      <label for="groq">Groq API key (<a href="https://console.groq.com/keys" target="_blank">get one</a>)</label>
      <input id="groq" type="password" autocomplete="off" required />

      <label for="hf">Hugging Face token (<a href="https://huggingface.co/settings/tokens" target="_blank">get one</a>)</label>
      <input id="hf" type="password" autocomplete="off" required />

      <label for="gemini">Gemini API key (<a href="https://aistudio.google.com/apikey" target="_blank">get one</a>)</label>
      <input id="gemini" type="password" autocomplete="off" required />

      <div class="error" id="error"></div>
      <button type="submit" id="submit-btn">Save and continue</button>
    </form>
    <script src="./renderer.js"></script>
  </body>
</html>
