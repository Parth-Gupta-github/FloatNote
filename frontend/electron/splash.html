<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FloatNote</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: Segoe UI, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box { text-align: center; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
      .sub { margin-top: 10px; color: #94a3b8; font-size: 14px; }
      .spinner {
        margin: 28px auto 0;
        width: 34px;
        height: 34px;
        border: 3px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">FloatNote 🎙️</div>
      <div class="sub">Starting the meeting engine…</div>
      <div class="sub">First launch downloads speech models — this can take a minute.</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
